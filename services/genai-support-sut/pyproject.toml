[project]
name = "egap-genai-support-sut"
version = "0.1.0"
description = "Synthetic SaaS support service foundation; no persistent jobs or LLM yet"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["httpx2==2.16.0"]

[tool.uv]
# 当前直接运行src，避免引入尚无用途的发布/构建后端。
package = false
required-version = "==0.13.7"
default-groups = ["dev"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
